allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    // AGP 8 requires every Android module to declare a `namespace`. Some older
    // Flutter plugins still only set `package` in their manifest, which fails
    // the build. Backfill the namespace from the manifest package. Registered
    // here (before evaluationDependsOn below) so it runs before evaluation.
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            def androidExt = project.extensions.findByName("android")
            if (androidExt != null) {
                if (androidExt.namespace == null) {
                    def manifestFile = project.file("src/main/AndroidManifest.xml")
                    if (manifestFile.exists()) {
                        def pkg = new XmlParser().parse(manifestFile).attribute("package")
                        if (pkg != null && !pkg.toString().isEmpty()) {
                            androidExt.namespace = pkg.toString()
                        }
                    }
                }
                // Align Java target across plugins.
                androidExt.compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
            // Force Kotlin's jvmTarget to 17 to match Java. Some plugins pin it
            // lower (e.g. audio_session uses 11) → "Inconsistent JVM-target"
            // failures. Detect Kotlin tasks by class name to avoid needing the
            // Kotlin Gradle plugin on the root build script's classpath.
            project.tasks.configureEach { task ->
                if (task.class.name.contains("KotlinCompile")) {
                    task.kotlinOptions { jvmTarget = "17" }
                }
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
